<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRIS Kiosk Presentation — Live IDE Slide Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0d14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #121826;
      border-bottom: 1px solid #243048;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #182032;
      color: #00f2fe;
      border: 1px solid #00f2fe44;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      background: #1a2234;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #00f2fe22;
      border-color: #00f2fe;
      color: #00f2fe;
    }
    .btn-primary {
      background: #00f2fe22;
      border-color: #00f2fe;
      color: #00f2fe;
    }
    .btn-primary:hover {
      background: #00f2fe;
      color: #000;
    }
    .timer {
      font-size: 12px;
      font-family: monospace;
      color: #10b981;
      font-weight: bold;
      min-width: 60px;
    }
    .counter {
      font-size: 12px;
      font-weight: bold;
      color: #00f2fe;
      min-width: 70px;
      text-align: center;
    }
    .main-view {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .slide-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #07090e;
      position: relative;
    }
    .slide-img {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 0 1px #243048;
      transition: opacity 0.5s ease-in-out;
    }
    .thumbnails-rail {
      width: 240px;
      background: #0d121c;
      border-left: 1px solid #1e293b;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .thumb-item {
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      background: #151c2a;
      transition: all 0.2s;
    }
    .thumb-item:hover {
      border-color: #00f2fe88;
    }
    .thumb-item.active {
      border-color: #00f2fe;
      box-shadow: 0 0 12px #00f2fe44;
    }
    .thumb-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .thumb-label {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      padding: 4px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thumb-item.active .thumb-label {
      color: #00f2fe;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="badge">VIVO IGNITE FINALE</span>
      <span class="title">Project IRIS · 3-Minute Kiosk Presentation (33 Slides)</span>
    </div>
    <div class="controls">
      <button id="playBtn" class="btn-primary" onclick="togglePlay()">▶ Play Kiosk (3:00 Loop)</button>
      <span class="timer" id="timer">0:00 / 3:00</span>
      <button id="prevBtn" onclick="prevSlide()">← Prev</button>
      <span class="counter" id="counter">01 / 33</span>
      <button id="nextBtn" onclick="nextSlide()">Next →</button>
      <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button onclick="reloadImages()">↺ Refresh</button>
    </div>
  </header>

  <div class="main-view">
    <div class="slide-stage" id="stage">
      <img id="mainSlide" class="slide-img" src="slide_previews/slide_01.png" alt="Current Slide">
    </div>
    <div class="thumbnails-rail" id="thumbRail"></div>
  </div>

  <script>
    const totalSlides = 33;
    let currentSlide = 1;
    let isPlaying = false;
    let playTimer = null;
    let timeElapsed = 0;
    let clockTimer = null;
    const slideDuration = 5600; // 5.6 seconds per content slide (33 slides ~ 3 minutes)

    const titles = [
      "01 · Hero Kiosk Cover & Title",
      "02 · Act 1: The ₹885 Solution",
      "03 · Act 1: Origin & Stakeholders",
      "04 · Act 1: Scale (1.5M+ India)",
      "05 · Act 1: ₹25L Monopoly Breakdown",
      "06 · Act 2: 99.96% Cost Reduction",
      "07 · Act 3: Bento 01 Magnet Pivot",
      "08 · Act 3: Bento 02 Airflow Mesh",
      "09 · Act 3: Bento 03 XIAO + LiPo",
      "10 · Act 3: Bento 04 2-3s Calibration",
      "11 · Act 3: Eye Safety (IEC 62471)",
      "12 · Act 4: App 01 4 Core Hubs",
      "13 · Act 4: App 02 Gemini AI Speech",
      "14 · Act 4: App 03 280ms Alert & IoT",
      "15 · Act 4: App 04 Flight Sim & Rehab",
      "16 · Act 4: Live Interactive Demo",
      "17 · Act 5: Hardware Schematic",
      "18 · Act 5: Pipeline 01 Sensors",
      "19 · Act 5: Pipeline 02 XIAO C3",
      "20 · Act 5: Pipeline 03 Python Bridge",
      "21 · Act 5: Debugging & Open Source",
      "22 · Act 5: Hardware Evolution",
      "23 · Act 6: Tobii vs IRIS Benchmark",
      "24 · Act 6: Engineering Honesty",
      "25 · Act 7: ₹885 BOM to ₹3K Kit",
      "26 · Act 7: UN SDGs & Clinical Sites",
      "27 · Act 7: Social Impact & Freedom",
      "28 · Act 8: Roadmap 01 Gaming",
      "29 · Act 8: Roadmap 02 Iris CV",
      "30 · Act 8: Roadmap 03 Robotics",
      "31 · Act 8: Predictive Text & Scope",
      "32 · Act 9: 98.4% Verified Numbers",
      "33 · Act 9: Call to Action & QR Code"
    ];

    function renderThumbs() {
      const rail = document.getElementById("thumbRail");
      rail.innerHTML = "";
      for (let i = 1; i <= totalSlides; i++) {
        const pad = String(i).padStart(2, '0');
        const div = document.createElement("div");
        div.className = "thumb-item" + (i === currentSlide ? " active" : "");
        div.id = `thumb-${i}`;
        div.onclick = () => goToSlide(i);
        div.innerHTML = `
          <img class="thumb-img" src="slide_previews/slide_${pad}.png?t=${Date.now()}" alt="Slide ${i}">
          <div class="thumb-label">${titles[i-1] || `Slide ${i}`}</div>
        `;
        rail.appendChild(div);
      }
    }

    function goToSlide(n) {
      if (n < 1) n = totalSlides;
      if (n > totalSlides) n = 1;
      currentSlide = n;
      const pad = String(n).padStart(2, '0');
      const img = document.getElementById("mainSlide");
      img.style.opacity = '0.3';
      setTimeout(() => {
        img.src = `slide_previews/slide_${pad}.png?t=${Date.now()}`;
        img.style.opacity = '1';
      }, 180);

      document.getElementById("counter").innerText = `${pad} / ${totalSlides}`;
      document.querySelectorAll(".thumb-item").forEach((el, idx) => {
        el.classList.toggle("active", idx + 1 === n);
      });
      const activeThumb = document.getElementById(`thumb-${n}`);
      if (activeThumb) activeThumb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function prevSlide() { goToSlide(currentSlide - 1); }
    function nextSlide() { goToSlide(currentSlide + 1); }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById("playBtn");
      if (isPlaying) {
        btn.innerText = "⏸ Pause Kiosk";
        btn.classList.add("btn-primary");
        playTimer = setInterval(() => {
          nextSlide();
        }, slideDuration);
        clockTimer = setInterval(() => {
          timeElapsed++;
          const mins = Math.floor(timeElapsed / 60);
          const secs = String(timeElapsed % 60).padStart(2, '0');
          document.getElementById("timer").innerText = `${mins}:${secs} / 3:00`;
          if (timeElapsed >= 180) timeElapsed = 0;
        }, 1000);
      } else {
        btn.innerText = "▶ Play Kiosk (3:00 Loop)";
        clearInterval(playTimer);
        clearInterval(clockTimer);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function reloadImages() {
      goToSlide(currentSlide);
      renderThumbs();
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === " ") togglePlay();
      if (e.key === "f" || e.key === "F") toggleFullscreen();
    });

    renderThumbs();
  </script>
</body>
</html>
